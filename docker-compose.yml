name: livraria

# Sobe tudo com: docker compose up --build
# Ferramentas visuais dos bancos (opcional): docker compose --profile tools up

x-dev-env: &dev-env
  DATABASE_URL: postgresql://livraria:livraria@postgres:5432/livraria?schema=public
  MONGO_URL: mongodb://mongo:27017/livraria
  REDIS_URL: redis://redis:6379

services:
  # ---------- Bancos ----------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: livraria
      POSTGRES_PASSWORD: livraria
      POSTGRES_DB: livraria
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livraria -d livraria"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:8
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- Aplicação ----------
  api:
    build: ./backend
    environment:
      <<: *dev-env
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-dev-secret-troque-isso}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - api-node-modules:/app/node_modules
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

  # ---------- Ferramentas (profile "tools") ----------
  adminer:
    image: adminer:4
    profiles: ["tools"]
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on: [postgres]

  mongo-express:
    image: mongo-express:1
    profiles: ["tools"]
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on: [mongo]

  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles: ["tools"]
    ports:
      - "8083:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on: [redis]

volumes:
  pg-data:
  mongo-data:
  redis-data:
  api-node-modules:
  web-node-modules:
